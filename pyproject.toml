[project]
name = "bidding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "chromadb>=1.5.9",
    "fastapi>=0.146.0",
    "langgraph>=1.2.16",
    "openai>=3.35.1",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.54.0",
    "zai-sdk>=0.2.3",
]

[project.scripts]
bidding = "bidding:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
