# Redis local development configuration
# Start from the project root with:
#   .tools/redis-8.10.2/Redis-8.10.2-Windows-x64-msys2/redis-server.exe redis.conf

bind 127.0.0.1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

loglevel notice
logfile ""

databases 16

# RDB snapshots
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir ./redis_data

# AOF persistence (Celery broker and result backend)
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
